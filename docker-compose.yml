services:
  stempel-app:
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digitaler-stempel
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stempel.rule=Host(`pruefstempel.wuppt.de`)"
      - "traefik.http.routers.stempel.entrypoints=https"
      - "traefik.http.routers.stempel.tls.certresolver=cloudflare"
    restart: unless-stopped
    networks:
      - proxy

networks:
  proxy:
    external: true
